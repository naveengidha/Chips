<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Georgia','Times New Roman',serif;background:#08090f;margin:0;padding:0;color:#fff;display:flex;flex-direction:column;min-height:100vh;overscroll-behavior:none;}

/* ── Layout ── */
.container{padding:16px 16px 0;width:100%;}
.logo{text-align:center;margin-bottom:8px;display:block;width:100%;}
.logo svg{margin:auto;display:block;}
h1{text-align:center;color:#ffd447;margin:0 0 4px;font-size:26px;letter-spacing:1px;font-family:'Georgia','Times New Roman',serif;}
.subtitle{text-align:center;color:rgba(255,255,255,0.4);font-size:12px;margin:0 0 20px;letter-spacing:2px;text-transform:uppercase;}

/* ── Session cards area ── */
.sessions-section{width:100%;padding:0 16px 110px;}
.sessions-label{font-size:13px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:#ffd447;margin:0 0 10px;text-align:center;font-family:'Georgia','Times New Roman',serif;}

/* ── Session card ── */
.scard{background:repeating-linear-gradient(45deg,rgba(255,212,71,0.025) 0,rgba(255,212,71,0.025) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(255,212,71,0.025) 0,rgba(255,212,71,0.025) 1px,transparent 1px,transparent 10px),#0d0f1a;border:1px solid rgba(255,212,71,0.2);border-radius:12px;margin-bottom:10px;overflow:hidden;cursor:pointer;transition:border-color .15s;}
.scard:hover,.scard:active{border-color:rgba(255,212,71,0.55);}
.scard-body{padding:13px 14px 10px;}
.scard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.scard-label{font-size:11px;font-weight:bold;color:#ffd447;letter-spacing:.5px;text-transform:uppercase;font-family:'Georgia','Times New Roman',serif;}
.scard-date{font-size:11px;color:rgba(255,255,255,0.45);}
.scard-mid{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.scard-info{flex:1;min-width:0;}
.scard-venue{font-size:15px;font-weight:bold;color:rgba(255,235,180,0.92);line-height:1.2;margin-bottom:2px;font-family:'Georgia','Times New Roman',serif;}
.scard-meta{font-size:11px;color:rgba(255,255,255,0.38);}
.scard-result{display:flex;flex-direction:column;gap:2px;flex-shrink:0;margin-left:12px;align-items:flex-end;}
.scard-pnl{font-size:20px;font-weight:bold;font-family:'Courier New',monospace;}
.scard-pnl.win{color:#2ecc71;}
.scard-pnl.loss{color:#e07070;}
.scard-pnl.even{color:rgba(255,255,255,0.4);}
.scard-hands{font-size:11px;color:rgba(255,255,255,0.35);}

/* Expand chevron */
.expand-chevron{font-size:9px;color:rgba(255,212,71,0.3);display:inline-block;transition:transform .2s;margin-left:6px;}
.scard.expanded .expand-chevron{transform:rotate(180deg);}

/* ── Stat tiles in card ── */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 0 10px;}
.stat-chip{background:rgba(0,0,0,0.3);border:1px solid rgba(255,212,71,0.1);border-radius:7px;padding:7px 4px;text-align:center;}
.stat-val{font-size:15px;font-weight:bold;color:#ffd447;font-family:'Courier New',monospace;display:block;}
.stat-lbl{font-size:8px;color:rgba(255,212,71,0.4);letter-spacing:1px;text-transform:uppercase;display:block;margin-top:2px;}

/* ── Expanded section ── */
.scard-expand{display:none;border-top:1px solid rgba(255,212,71,0.1);padding:12px 14px 14px;}
.scard.expanded .scard-expand{display:block;}

/* Full stat grid */
.full-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.rs-tile{background:rgba(0,0,0,0.25);border:1px solid rgba(255,212,71,0.12);border-radius:7px;padding:9px 8px;text-align:center;}
.rs-val{font-size:18px;font-weight:bold;color:#ffd447;font-family:'Courier New',monospace;display:block;}
.rs-lbl{font-size:9px;color:rgba(255,212,71,0.4);letter-spacing:1.2px;text-transform:uppercase;display:block;margin-top:2px;}

/* ── Hands sub-section ── */
.hands-section-toggle{display:flex;align-items:center;gap:6px;padding:9px 0 9px;cursor:pointer;border-top:1px solid rgba(255,212,71,0.08);color:rgba(255,212,71,0.55);font-size:11px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;-webkit-user-select:none;}
.hands-section-toggle .hst-chevron{font-size:9px;display:inline-block;transition:transform .2s;margin-left:auto;}
.hands-section-toggle.open .hst-chevron{transform:rotate(180deg);}
.hands-list{display:none;padding:4px 0 0;}
.hands-list.open{display:block;}

/* Hand entry card */
.hcard{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);border-radius:8px;margin-bottom:6px;font-size:12px;overflow:hidden;cursor:pointer;-webkit-user-select:none;}
.hcard:active{background:rgba(0,0,0,0.3);}
.hcard-collapsed{padding:9px 10px;display:flex;align-items:center;gap:7px;}
.hcard-num{font-size:10px;font-weight:bold;color:rgba(255,212,71,0.38);letter-spacing:1px;text-transform:uppercase;flex-shrink:0;min-width:46px;}
/* mini playing cards */
.hcard-cards{display:flex;gap:3px;flex-shrink:0;}
.mini-card{width:22px;height:30px;border-radius:3px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:bold;line-height:1;flex-shrink:0;}
.mini-card.empty{background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.12);}
.mini-card.empty span{color:rgba(255,255,255,0.15);}
/* position badge (index) */
.hcard-pos{font-size:9px;font-weight:bold;padding:2px 5px;border-radius:3px;background:rgba(255,212,71,0.1);border:1px solid rgba(255,212,71,0.25);color:rgba(255,212,71,0.7);flex-shrink:0;letter-spacing:.5px;}
.hcard-pos.empty-pos{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.08);color:rgba(255,255,255,0.2);}
/* preflop badge */
.hcard-pf{flex:1;font-size:10px;font-weight:bold;letter-spacing:.3px;}
.hcard-result{font-weight:bold;font-family:'Courier New',monospace;font-size:13px;flex-shrink:0;margin-left:auto;}
.hcard-result.won{color:#2ecc71;}
.hcard-result.lost{color:#e07070;}
.hcard-result.even{color:rgba(255,255,255,0.28);}
/* expand chevron on hand */
.hcard-chevron{font-size:9px;color:rgba(255,212,71,0.25);flex-shrink:0;transition:transform .18s;}
.hcard.hexp .hcard-chevron{transform:rotate(180deg);}
/* expanded body */
.hcard-detail{display:none;border-top:1px solid rgba(255,255,255,0.05);padding:10px;}
.hcard.hexp .hcard-detail{display:block;}
/* street row in detail */
.hd-street{margin-bottom:8px;}
.hd-street-label{font-size:8px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,212,71,0.38);margin-bottom:4px;}
.hd-chips{display:flex;flex-wrap:wrap;gap:4px;}
.chip{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:bold;letter-spacing:.3px;}
.chip-action{background:rgba(180,160,100,0.12);border:1px solid rgba(180,160,100,0.25);color:rgba(255,212,71,0.7);}
.chip-fold{background:rgba(100,100,100,0.12);border:1px solid rgba(150,150,150,0.2);color:rgba(200,200,200,0.55);}
.chip-call{background:rgba(46,100,200,0.12);border:1px solid rgba(46,150,220,0.25);color:rgba(120,180,255,0.75);}
.chip-raise{background:rgba(200,140,46,0.12);border:1px solid rgba(220,160,46,0.25);color:rgba(255,200,80,0.85);}
.chip-check{background:rgba(46,160,100,0.1);border:1px solid rgba(46,180,100,0.2);color:rgba(100,220,150,0.7);}
.chip-bluff{background:rgba(180,46,46,0.12);border:1px solid rgba(200,60,60,0.25);color:rgba(255,100,100,0.75);}
.chip-street{background:rgba(255,212,71,0.06);border:1px solid rgba(255,212,71,0.15);color:rgba(255,212,71,0.4);font-size:9px;letter-spacing:1px;text-transform:uppercase;}
.hcard-notes{font-size:11px;color:rgba(255,255,255,0.3);margin-top:6px;font-style:italic;line-height:1.4;}
/* villain section in detail */
.hd-villains{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05);}
.hd-villain-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.hd-villain-label{font-size:8px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.25);min-width:22px;}
/* community cards strip in detail */
.hd-community{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}

/* Empty states */
.empty-state{text-align:center;color:rgba(255,255,255,0.25);padding:30px 20px;font-size:13px;line-height:2;}

/* ── Delete button ── */
.scard-delete{background:none;border:1px solid rgba(220,50,50,0.35);border-radius:8px;color:rgba(220,100,100,0.8);font-size:11px;font-weight:bold;padding:5px 12px;cursor:pointer;letter-spacing:.5px;align-self:flex-start;}
.scard-delete:active{background:rgba(220,50,50,0.2);}
.scard-expand-footer{display:flex;justify-content:flex-end;padding-top:10px;}

/* ── Bottom pill nav ── */
nav.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:8px 16px max(env(safe-area-inset-bottom),12px);background:linear-gradient(to top,#08090f 70%,transparent);z-index:100;pointer-events:none;}
.nav-pill{display:flex;align-items:center;justify-content:space-between;background:rgba(13,15,26,0.97);border:1px solid rgba(255,212,71,0.18);border-radius:40px;padding:6px 16px;gap:4px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.5);pointer-events:all;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,0.35);font-size:9px;font-weight:bold;letter-spacing:.8px;text-transform:uppercase;text-decoration:none;padding:4px 8px;border-radius:20px;transition:color .15s;font-family:'Georgia','Times New Roman',serif;}
.nav-item svg{width:20px;height:20px;stroke:currentColor;}
.nav-item.active,.nav-item:active{color:#ffd447;}
.nav-center{background:linear-gradient(135deg,#c9a227,#ffd447,#c9a227);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;box-shadow:0 2px 10px rgba(139,94,60,0.5);flex-shrink:0;text-decoration:none;border:none;}
.nav-center svg{width:26px;height:26px;}
.nav-center:active{opacity:.85;}

/* Active session pulse dot */
.active-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2ecc71;margin-right:5px;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.active-scard{border-color:rgba(46,204,113,0.4)!important;background:repeating-linear-gradient(45deg,rgba(46,204,113,0.025) 0,rgba(46,204,113,0.025) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(46,204,113,0.025) 0,rgba(46,204,113,0.025) 1px,transparent 1px,transparent 10px),#0a100d!important;}
.active-scard:hover,.active-scard:active{border-color:rgba(46,204,113,0.7)!important;}
.active-label{color:rgba(46,204,113,0.8)!important;}
</style>
</head>

<script>
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(d){ if(!d) return ''; let dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
function fmtDur(mins){ if(!mins) return '–'; let h=Math.floor(mins/60),m=mins%60; return h>0?h+'h '+(m?m+'m':''):m+'m'; }

function loadSessions(){ try{ return JSON.parse(localStorage.getItem('fcSessions')||'[]'); }catch(e){ return []; } }
function saveSessions(arr){ localStorage.setItem('fcSessions',JSON.stringify(arr)); }

function pnlClass(v){ return v>0?'win':v<0?'loss':'even'; }
function fmtPnl(v){ if(v==null) return '–'; return v===0?'±0':(v>0?'+'+v:String(v)); }

function calcSessionStats(s){
  let hands = s.hands||[];
  let n = hands.length;
  if(!n) return null;
  let vpip=0, pfr=0, folds=0, limps=0, raises=0, calls=0, checks=0;
  let cbet=0, cbetOpp=0;
  hands.forEach(h=>{
    let pf = h.preflop||'';
    if(pf==='fold') folds++;
    else{
      vpip++;
      if(pf==='limp'||pf==='call') { limps++; }
      if(pf==='raise'||pf==='3bet') { raises++; pfr++; }
      if(pf==='call') calls++;
      if(pf==='check') checks++;
    }
    // cbet: raised preflop and bet flop
    if((pf==='raise'||pf==='3bet') && h.flop && h.flop.actions && h.flop.actions.includes('bet')){ cbet++; }
    if(pf==='raise'||pf==='3bet'){ cbetOpp++; }
  });
  let vpipPct = n>0 ? Math.round(vpip/n*100) : 0;
  let pfrPct  = n>0 ? Math.round(pfr/n*100) : 0;
  let foldPct = n>0 ? Math.round(folds/n*100) : 0;
  let limpPct = n>0 ? Math.round(limps/n*100) : 0;
  let raisePct= n>0 ? Math.round(raises/n*100) : 0;
  let cbetPct = cbetOpp>0 ? Math.round(cbet/cbetOpp*100) : null;
  return { n, vpipPct, pfrPct, foldPct, limpPct, raisePct, cbetPct };
}

let expandedSessions = new Set();
let expandedHands = new Set();

function renderSessionCards(){
  let sessions = loadSessions().sort((a,b)=>new Date(b.startedAt||0)-new Date(a.startedAt||0));
  let el = document.getElementById('sessionCards');
  if(!el) return;

  // Active session banner
  let active = sessions.find(s=>s.active);
  let banner = document.getElementById('activeSessionBanner');
  if(active){
    banner.style.display='';
    banner.innerHTML=`<a href="session.html" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;text-decoration:none;color:#fff;border:1px solid rgba(46,204,113,0.35);background:repeating-linear-gradient(45deg,rgba(46,204,113,0.025) 0,rgba(46,204,113,0.025) 1px,transparent 1px,transparent 10px),repeating-linear-gradient(-45deg,rgba(46,204,113,0.025) 0,rgba(46,204,113,0.025) 1px,transparent 1px,transparent 10px),#0a100d;transition:border-color .15s;">
      <div style="font-size:20px;flex-shrink:0;">🃏</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:11px;font-weight:bold;color:rgba(46,204,113,0.8);letter-spacing:.5px;text-transform:uppercase;"><span class="active-dot"></span>Active Session</div>
        <div style="font-size:14px;font-weight:bold;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(active.venue||'Unknown Venue')}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:1px;">${(active.hands||[]).length} hands recorded</div>
      </div>
      <div style="color:rgba(46,204,113,0.4);font-size:18px;flex-shrink:0;">›</div>
    </a>`;
  } else {
    banner.style.display='none';
  }

  let pastSessions = sessions.filter(s=>!s.active);
  if(!pastSessions.length){
    el.innerHTML = '<div class="empty-state">No sessions recorded yet.<br>Tap + to start tracking.</div>';
    return;
  }
  el.innerHTML = '';
  pastSessions.forEach(s=>{
    let stats = calcSessionStats(s);
    let isExp = expandedSessions.has(s.id);
    let pnl = s.pnl;
    let pnlStr = pnl!=null ? (pnl>=0?(pnl===0?'±$0':'+$'+pnl):'-$'+Math.abs(pnl)) : '–';

    let card = document.createElement('div');
    card.className = 'scard'+(isExp?' expanded':'');
    card.innerHTML = `
      <div class="scard-body">
        <div class="scard-top">
          <span class="scard-label">Session<span class="expand-chevron">▼</span></span>
          <span class="scard-date">${esc(fmtDate(s.startedAt))}</span>
        </div>
        <div class="scard-mid">
          <div class="scard-info">
            <div class="scard-venue">${esc(s.venue||'Unknown Venue')}</div>
            <div class="scard-meta">${s.gameType||'NL Hold\'em'} · ${s.stake||'?'} · ${fmtDur(s.durationMins)}</div>
            ${stats ? `<div class="stat-strip">
              <div class="stat-chip"><span class="stat-val">${stats.vpipPct}%</span><span class="stat-lbl">VPIP</span></div>
              <div class="stat-chip"><span class="stat-val">${stats.pfrPct}%</span><span class="stat-lbl">PFR</span></div>
              <div class="stat-chip"><span class="stat-val">${stats.foldPct}%</span><span class="stat-lbl">Fold</span></div>
              <div class="stat-chip"><span class="stat-val">${stats.n}</span><span class="stat-lbl">Hands</span></div>
            </div>` : ''}
          </div>
          <div class="scard-result">
            <span class="scard-pnl ${pnlClass(pnl)}">${pnlStr}</span>
            ${stats ? `<span class="scard-hands">${stats.n} hands</span>` : ''}
          </div>
        </div>
      </div>
      <div class="scard-expand">
        ${stats ? buildFullStats(s, stats) : ''}
        ${buildHandsList(s)}
        <div class="scard-expand-footer">
          <button class="scard-delete" data-id="${s.id}">Delete Session</button>
        </div>
      </div>`;

    card.addEventListener('click', e=>{
      if(e.target.closest('.scard-delete')) return;
      if(e.target.closest('.hands-section-toggle')) return;
      if(e.target.closest('.hands-list')) return;
      if(expandedSessions.has(s.id)) expandedSessions.delete(s.id);
      else expandedSessions.add(s.id);
      card.classList.toggle('expanded', expandedSessions.has(s.id));
    });

    card.querySelector('.scard-delete').addEventListener('click', e=>{
      e.stopPropagation();
      if(!confirm('Delete this session? This cannot be undone.')) return;
      let sessions = loadSessions().filter(x=>x.id!==s.id);
      saveSessions(sessions);
      expandedSessions.delete(s.id);
      renderSessionCards();
    });

    // Wire hands toggle
    let hToggle = card.querySelector('.hands-section-toggle');
    if(hToggle){
      hToggle.addEventListener('click', e=>{
        e.stopPropagation();
        let list = card.querySelector('.hands-list');
        let isOpen = list.classList.toggle('open');
        hToggle.classList.toggle('open', isOpen);
      });
    }

    // Wire individual hand card expand
    card.querySelector('.hands-list').addEventListener('click', e=>{
      e.stopPropagation();
      let hcard = e.target.closest('.hcard');
      if(!hcard) return;
      hcard.classList.toggle('hexp');
    });

    el.appendChild(card);
  });
}

function buildFullStats(s, stats){
  if(!stats) return '';
  let cbetStr = stats.cbetPct!=null ? stats.cbetPct+'%' : '–';
  return `<div class="full-stat-grid">
    <div class="rs-tile"><span class="rs-val">${stats.vpipPct}%</span><span class="rs-lbl">VPIP</span></div>
    <div class="rs-tile"><span class="rs-val">${stats.pfrPct}%</span><span class="rs-lbl">PFR</span></div>
    <div class="rs-tile"><span class="rs-val">${stats.foldPct}%</span><span class="rs-lbl">Fold %</span></div>
    <div class="rs-tile"><span class="rs-val">${stats.limpPct}%</span><span class="rs-lbl">Limp %</span></div>
    <div class="rs-tile"><span class="rs-val">${stats.raisePct}%</span><span class="rs-lbl">Raise %</span></div>
    <div class="rs-tile"><span class="rs-val">${cbetStr}</span><span class="rs-lbl">C-Bet %</span></div>
    <div class="rs-tile"><span class="rs-val">${stats.n}</span><span class="rs-lbl">Hands</span></div>
    <div class="rs-tile"><span class="rs-val" style="color:${s.pnl>0?'#2ecc71':s.pnl<0?'#e07070':'rgba(255,255,255,0.4)'}">${fmtPnl(s.pnl)}</span><span class="rs-lbl">P&amp;L ($)</span></div>
  </div>`;
}

function buildHandsList(s){
  let hands = (s.hands||[]);
  let html = `<div class="hands-section-toggle"><span>Recorded Hands (${hands.length})</span><span class="hst-chevron">▼</span></div>
  <div class="hands-list">`;
  if(!hands.length){
    html += '<div style="color:rgba(255,255,255,0.25);font-size:12px;padding:8px 0 4px;">No hands recorded.</div>';
  } else {
    hands.slice().reverse().forEach((h,ri)=>{
      let hNum = hands.length - ri;
      let hid = s.id+'_'+h.id;
      html += buildHandCard(h, hNum, hid);
    });
  }
  html += '</div>';
  return html;
}

function buildHandCard(h, hNum, hid){
  const SUIT_SYM   = {s:'♠',h:'♥',d:'♦',c:'♣'};
  const SUIT_COLOR = {s:'#1a1a1a',h:'#c0202a',d:'#c0202a',c:'#1a1a1a'};
  const PF_LABEL   = {fold:'Fold',limp:'Limp',call:'Call',raise:'Raise','3bet':'3-Bet',check:'Check'};
  const PF_COLOR   = {fold:'rgba(180,180,200,0.55)',limp:'rgba(120,180,255,0.75)',call:'rgba(120,180,255,0.75)',raise:'rgba(255,200,80,0.85)','3bet':'rgba(255,200,80,0.85)',check:'rgba(100,220,150,0.7)'};

  let result = h.result;
  let resultStr = result!=null ? (result===0?'±$0':(result>0?'+$'+result:'-$'+Math.abs(result))) : '–';
  let resCls = result>0?'won':result<0?'lost':'even';

  // hero position
  let pos = h.positions?.hero || null;
  let posBadge = pos
    ? `<span class="hcard-pos">${esc(pos)}</span>`
    : `<span class="hcard-pos empty-pos">–</span>`;

  // hero hole cards (mini cards)
  function miniCard(c){
    if(!c||(!c.rank&&!c.suit)) return `<div class="mini-card empty"><span>?</span></div>`;
    let isRed = c.suit==='h'||c.suit==='d';
    let color = isRed?'#c0202a':'#1a1a1a';
    return `<div class="mini-card"><span style="color:${color};font-size:8px;">${c.rank||'?'}</span><span style="color:${color};font-size:7px;">${SUIT_SYM[c.suit]||''}</span></div>`;
  }
  let heroCards = h.cards ? [h.cards.hero?.[0], h.cards.hero?.[1]] : [{},{}];
  let cardHtml = `<div class="hcard-cards">${miniCard(heroCards[0])}${miniCard(heroCards[1])}</div>`;

  // preflop label
  let pfCol = PF_COLOR[h.preflop]||'rgba(255,255,255,0.45)';
  let pfHtml = h.preflop
    ? `<span class="hcard-pf" style="color:${pfCol}">${PF_LABEL[h.preflop]||h.preflop}</span>`
    : `<span class="hcard-pf" style="color:rgba(255,255,255,0.2)">–</span>`;

  // ── Detail section ──
  let detailHtml = buildHandDetail(h);

  return `<div class="hcard" data-hid="${hid}">
    <div class="hcard-collapsed">
      <span class="hcard-num">#${hNum}</span>
      ${posBadge}
      ${cardHtml}
      ${pfHtml}
      <span class="hcard-result ${resCls}">${resultStr}</span>
      <span class="hcard-chevron">▼</span>
    </div>
    <div class="hcard-detail">${detailHtml}</div>
  </div>`;
}

function buildHandDetail(h){
  const SUIT_SYM   = {s:'♠',h:'♥',d:'♦',c:'♣'};
  const ACT_LABEL  = {fold:'Fold',check:'Check',call:'Call',bet:'Bet',raise:'Raise',bluff:'Bluff',cbet:'C-Bet',allin:'All-In'};
  const ACT_CLASS  = {fold:'chip-fold',check:'chip-check',call:'chip-call',bet:'chip-action',raise:'chip-raise',bluff:'chip-bluff',cbet:'chip-action',allin:'chip-raise'};

  function cardSpan(c){
    if(!c||(!c.rank&&!c.suit)) return '';
    let isRed = c.suit==='h'||c.suit==='d';
    let col = isRed?'rgba(210,50,50,1)':'rgba(255,212,71,0.9)';
    return `<span style="font-weight:bold;color:${col};font-size:11px;">${c.rank||'?'}${SUIT_SYM[c.suit]||'?'}</span>`;
  }
  function miniCardDetail(c){
    if(!c||(!c.rank&&!c.suit)) return `<div class="mini-card empty"><span>?</span></div>`;
    let isRed = c.suit==='h'||c.suit==='d';
    let color = isRed?'#c0202a':'#1a1a1a';
    return `<div class="mini-card"><span style="color:${color};font-size:8px;">${c.rank||'?'}</span><span style="color:${color};font-size:7px;">${SUIT_SYM[c.suit]||''}</span></div>`;
  }

  let out = '';

  // Preflop row
  if(h.preflop){
    const PF_LABEL  = {fold:'Fold',limp:'Limp',call:'Call',raise:'Raise','3bet':'3-Bet',check:'Check'};
    const PF_CLASS  = {fold:'chip-fold',limp:'chip-call',call:'chip-call',raise:'chip-raise','3bet':'chip-raise',check:'chip-check'};
    out += `<div class="hd-street">
      <div class="hd-street-label">Pre-Flop</div>
      <div class="hd-chips"><span class="chip ${PF_CLASS[h.preflop]||'chip-action'}">${PF_LABEL[h.preflop]||h.preflop}</span></div>
    </div>`;
  }

  // Community cards strip (show what was recorded)
  let community = h.cards?.community?.filter(c=>c&&(c.rank||c.suit))||[];
  if(community.length){
    out += `<div class="hd-street">
      <div class="hd-street-label">Board</div>
      <div class="hd-community">${community.map(c=>cardSpan(c)).join(' ')}</div>
    </div>`;
  }

  // Flop / Turn / River
  ['flop','turn','river'].forEach(street=>{
    let sd = h[street];
    if(!sd || !sd.actions?.length) return;
    let chips = sd.actions.map(a=>`<span class="chip ${ACT_CLASS[a]||'chip-action'}">${ACT_LABEL[a]||a}</span>`).join('');
    out += `<div class="hd-street">
      <div class="hd-street-label">${street.charAt(0).toUpperCase()+street.slice(1)}</div>
      <div class="hd-chips">${chips}</div>
    </div>`;
  });

  // Villain section
  let villains = h.cards?.villains||[];
  let hasVillainData = villains.some(v=>v&&v.some(c=>c&&(c.rank||c.suit)));
  let vPositions = h.positions||{};
  if(villains.length || Object.keys(vPositions).filter(k=>k!=='hero').length){
    let vRows = '';
    for(let i=0;i<Math.max(villains.length,3);i++){
      let vKey='v'+(i+1);
      let vCards = villains[i]||[];
      let vPos = vPositions[vKey]||null;
      let hasCards = vCards.some(c=>c&&(c.rank||c.suit));
      if(!hasCards && !vPos) continue;
      vRows += `<div class="hd-villain-row">
        <span class="hd-villain-label">V${i+1}</span>
        ${vPos?`<span class="hcard-pos">${esc(vPos)}</span>`:''}
        <div class="hcard-cards">${miniCardDetail(vCards[0])}${miniCardDetail(vCards[1])}</div>
      </div>`;
    }
    if(vRows){
      out += `<div class="hd-villains">
        <div class="hd-street-label">Villains</div>${vRows}
      </div>`;
    }
  }

  // Notes
  if(h.notes) out += `<div class="hcard-notes">${esc(h.notes)}</div>`;

  return out || '<div style="color:rgba(255,255,255,0.2);font-size:11px;">No detail recorded.</div>';
}

// ── Lifetime stats overlay ──
function openLifetimeStats(){
  let sessions = loadSessions().filter(s=>!s.active);
  let el = document.getElementById('lifetimeStatsBody');
  if(!sessions.length){
    el.innerHTML = '<div class="empty-state">No completed sessions yet.</div>';
  } else {
    let totalHands=0, totalVpip=0, totalPfr=0, totalFolds=0, totalRaises=0, totalLimps=0, totalCbet=0, totalCbetOpp=0;
    let totalPnl=0;
    sessions.forEach(s=>{
      let st = calcSessionStats(s);
      if(st){
        totalHands += st.n;
        totalVpip  += st.vpipPct * st.n;
        totalPfr   += st.pfrPct  * st.n;
        totalFolds += st.foldPct * st.n;
        totalRaises+= st.raisePct* st.n;
        totalLimps += st.limpPct * st.n;
        if(st.cbetPct!=null){ totalCbet += st.cbetPct; totalCbetOpp++; }
      }
      if(s.pnl!=null) totalPnl += s.pnl;
    });
    let avg = v => totalHands>0 ? Math.round(v/totalHands) : 0;
    let avgCbet = totalCbetOpp>0 ? Math.round(totalCbet/totalCbetOpp) : null;
    let pnlStr = totalPnl===0?'±$0':(totalPnl>0?'+$'+totalPnl:'-$'+Math.abs(totalPnl));
    el.innerHTML = `
      <div class="full-stat-grid" style="margin-bottom:20px;">
        <div class="rs-tile"><span class="rs-val">${avg(totalVpip)}%</span><span class="rs-lbl">VPIP</span></div>
        <div class="rs-tile"><span class="rs-val">${avg(totalPfr)}%</span><span class="rs-lbl">PFR</span></div>
        <div class="rs-tile"><span class="rs-val">${avg(totalFolds)}%</span><span class="rs-lbl">Fold %</span></div>
        <div class="rs-tile"><span class="rs-val">${avg(totalLimps)}%</span><span class="rs-lbl">Limp %</span></div>
        <div class="rs-tile"><span class="rs-val">${avg(totalRaises)}%</span><span class="rs-lbl">Raise %</span></div>
        <div class="rs-tile"><span class="rs-val">${avgCbet!=null?avgCbet+'%':'–'}</span><span class="rs-lbl">C-Bet %</span></div>
        <div class="rs-tile"><span class="rs-val">${totalHands}</span><span class="rs-lbl">Total Hands</span></div>
        <div class="rs-tile"><span class="rs-val" style="color:${totalPnl>0?'#2ecc71':totalPnl<0?'#e07070':'rgba(255,255,255,0.4)'}">${pnlStr}</span><span class="rs-lbl">Total P&amp;L</span></div>
      </div>
      <div style="font-size:10px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;color:rgba(255,212,71,0.4);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid rgba(255,212,71,0.1);">Sessions (${sessions.length})</div>
      ${sessions.map(s=>{
        let st = calcSessionStats(s);
        let pnl = s.pnl;
        let pnlS = pnl!=null?(pnl>=0?(pnl===0?'±$0':'+$'+pnl):'-$'+Math.abs(pnl)):'–';
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;">
          <div>
            <div style="font-weight:bold;color:rgba(255,235,180,0.85);">${esc(s.venue||'Unknown')}</div>
            <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:1px;">${esc(fmtDate(s.startedAt))} · ${st?st.n:0} hands</div>
          </div>
          <span style="font-family:'Courier New',monospace;font-weight:bold;font-size:14px;color:${pnl>0?'#2ecc71':pnl<0?'#e07070':'rgba(255,255,255,0.35)'};">${pnlS}</span>
        </div>`;
      }).join('')}`;
  }
  document.getElementById('lifetimeOverlay').style.display='flex';
}
function closeLifetimeStats(){
  document.getElementById('lifetimeOverlay').style.display='none';
}

function startNewSession(){
  // If there's already an active session, go to it
  let sessions = loadSessions();
  let active = sessions.find(s=>s.active);
  if(active){
    window.location.href='session.html';
    return;
  }
  window.location.href='session.html';
}

renderSessionCards();
window.addEventListener('storage', renderSessionCards);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) renderSessionCards(); });
